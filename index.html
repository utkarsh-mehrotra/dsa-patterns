<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Patterns – Core Ideas, When to Use & Examples</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #eeede8;
    --text-primary: #1a1a18;
    --text-secondary: #5a5a56;
    --text-tertiary: #9a9a94;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --mark-bg: #faeeda;
    --mark-color: #854f0b;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #262624;
      --bg-tertiary: #2e2e2b;
      --text-primary: #f0efea;
      --text-secondary: #a8a89f;
      --text-tertiary: #68685f;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.22);
      --mark-bg: #412402;
      --mark-color: #fac775;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  #search {
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    background: var(--bg);
    color: var(--text-primary);
    margin-bottom: 14px;
    outline: none;
    font-family: inherit;
  }
  #search:focus { border-color: var(--text-secondary); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filter-btn {
    padding: 5px 12px;
    font-size: 12px;
    border: 0.5px solid var(--border-strong);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border-color: var(--text-tertiary);
  }
  .filter-btn.active { font-weight: 500; }
  .stats-bar { font-size: 12px; color: var(--text-tertiary); margin-bottom: 18px; }
  .stats-bar b { color: var(--text-secondary); font-weight: 500; }
  .category-section { margin-bottom: 24px; }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--border);
  }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cat-title { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .cat-count { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }
  .patterns-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .pattern-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .pattern-card:hover { border-color: var(--border-strong); }
  .pattern-card.expanded { border-color: var(--border-strong); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pattern-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .expand-icon {
    font-size: 11px;
    color: var(--text-tertiary);
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform 0.15s;
    user-select: none;
  }
  .pattern-card.expanded .expand-icon { transform: rotate(180deg); }
  .pattern-idea { font-size: 13px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; }
  .card-details {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 0.5px solid var(--border);
  }
  .pattern-card.expanded .card-details { display: block; }
  .detail-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: baseline; }
  .detail-row:last-child { margin-bottom: 0; }
  .detail-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    min-width: 60px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .detail-val { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .example-pill {
    display: inline-block;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    margin: 2px 2px 0 0;
  }
  .no-results { text-align: center; padding: 48px 0; color: var(--text-tertiary); font-size: 14px; }
  mark {
    background: var(--mark-bg);
    color: var(--mark-color);
    border-radius: 2px;
    padding: 0 1px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>DSA Patterns</h1>
  <p class="subtitle">Core ideas, when to use &amp; examples — click any card to expand</p>

  <input id="search" type="text" placeholder="Search patterns, ideas, examples..." autocomplete="off" />
  <div class="filters" id="filters"></div>
  <div class="stats-bar">Showing <b id="count">0</b> of <b id="total">0</b> patterns</div>
  <div id="content"></div>
</div>

<script>
const data = [
  {cat:"Arrays & Strings", color:"#378ADD", patterns:[
    {name:"Two Pointers",idea:"Move two indices to compare or shrink a range.",when:"Sorted input, pairs/triplets, both ends.",examples:["Two Sum","3Sum"]},
    {name:"Sliding Window",idea:"Track a moving subarray or substring.",when:"Max or min length/sum of a contiguous segment.",examples:["Min Size Subarray Sum","Longest Substring Without Repeating"]},
    {name:"Merge Intervals",idea:"Sort intervals then merge or clip overlaps.",when:"Input is [start, end] ranges that must be combined.",examples:["Merge Intervals","Insert Interval"]},
    {name:"Prefix Sums",idea:"Precompute running sums for O(1) range queries.",when:"Many subarray sums or counts on same array.",examples:["Subarray Sum Equals K","Range Sum Query"]},
    {name:"Hashmaps",idea:"Store counts or mappings for O(1) lookup.",when:"Frequency, grouping, existence checks.",examples:["Group Anagrams","First Unique Character"]},
    {name:"Sorting",idea:"Sort first, then scan once.",when:"Order not given and logic becomes easier on sorted data.",examples:["Sort Colors","Meeting Rooms II"]},
  ]},
  {cat:"Linked Lists", color:"#1D9E75", patterns:[
    {name:"Fast and Slow Pointers",idea:"Two speeds to find middle or detect cycles.",when:"\"Find mid\", \"detect cycle\", \"nth from end\".",examples:["Linked List Cycle","Remove Nth Node From End"]},
    {name:"Dummy Node",idea:"Fake head to simplify insert and delete.",when:"Many head edge cases or complex rewiring.",examples:["Add Two Numbers","Merge Two Sorted Lists"]},
    {name:"In Place Reversal",idea:"Rewire pointers to reverse segments.",when:"\"Reverse list\", \"reverse k group\".",examples:["Reverse Linked List","Reverse Nodes in k Group"]},
    {name:"Recursive Tricks",idea:"Solve list by recurring on next part.",when:"\"Swap in pairs\", \"flatten\", clean recursive spec.",examples:["Swap Nodes in Pairs","Flatten Multilevel List"]},
    {name:"Monotonic Stack",idea:"Keep elements increasing or decreasing order.",when:"\"Next greater/smaller\", \"snaker\", daily temperatures.",examples:["Next Greater Element","Daily Temperatures"]},
    {name:"Design Using Stack/Queue",idea:"Build custom behavior with stack or queue.",when:"\"Next greater/smaller\", \"daily temperatures\", \"stock span\".",examples:["Implement Queue Using Stacks","Design Circular Queue"]},
  ]},
  {cat:"Binary Search", color:"#D85A30", patterns:[
    {name:"Basic Binary Search",idea:"Halve the search space on sorted data.",when:"Sorted array and direct target lookup.",examples:["Search Insert Position","Find Min in Rotated Array"]},
    {name:"Binary Search on Answer",idea:"Search on the value of the answer, not the index.",when:"\"Minimum X that works\" or \"maximum X possible\".",examples:["Split Array Largest Sum","Capacity To Ship Packages"]},
    {name:"Boundary / Count Search",idea:"Find first or last position that meets a condition.",when:"Need lower bound, upper bound, or count in sorted data.",examples:["First and Last Position of Element","Count Negatives in Sorted Matrix"]},
    {name:"Mountain / Bitonic Search",idea:"Find peak, then search both sorted sides.",when:"Array strictly increases then decreases.",examples:["Find Peak Element","Find in Mountain Array"]},
  ]},
  {cat:"Trees", color:"#7F77DD", patterns:[
    {name:"Tree Traversal",idea:"Visit nodes in preorder, inorder, postorder, level order.",when:"Binary Tree Inorder Traversal, Level Order Traversal.",examples:["Binary Tree Inorder Traversal","Level Order Traversal"]},
    {name:"Tree Construction",idea:"Rebuild tree from traversals or sorted data.",when:"Build Tree From Preorder and Inorder, Sorted Array to BST.",examples:["Build Tree From Preorder and Inorder","Sorted Array to BST"]},
    {name:"Path Sum",idea:"Track sums along root to leaf paths.",when:"Path Sum, Binary Tree Maximum Path Sum.",examples:["Path Sum","Binary Tree Maximum Path Sum"]},
    {name:"LCA and Search",idea:"DFS or BST rules to find nodes and their ancestor.",when:"Lowest Common Ancestor, Search in BST.",examples:["Lowest Common Ancestor","Search in BST"]},
    {name:"Validation / Properties",idea:"Check if tree meets property.",when:"Validate BST, Diameter of Binary Tree.",examples:["Validate BST","Diameter of Binary Tree"]},
  ]},
  {cat:"Stacks & Queues", color:"#BA7517", patterns:[
    {name:"Monotonic Stack",idea:"Use stack for numbers, operators, or paths.",when:"Evaluate expression, parentheses, RPN, path simplification.",examples:["Basic Calculator","Evaluate Reverse Polish Notation"]},
    {name:"Expression Stack",idea:"Deque stores candidates for window max or min.",when:"\"Sliding window maximum/minimum\" in O(n).",examples:["Sliding Window Maximum","Moving Average From Data Stream"]},
    {name:"Sliding Window Deque",idea:"Build custom behavior with stack or queue.",when:"\"Design a stack-queue with X operation\".",examples:["Implement Queue Using Stacks","Design Circular Queue"]},
  ]},
  {cat:"Heaps / Priority Queues", color:"#D4537E", patterns:[
    {name:"Kth Largest / Smallest",idea:"Maintain heap of size k.",when:"Kth Largest Element in Array, K Closest Points.",examples:["Kth Largest Element in Array","K Closest Points"]},
    {name:"Heap + Hashmap",idea:"Count with hashmap, select with heap.",when:"\"Top K frequent\" or \"sort by frequency\".",examples:["Top K Frequent Elements","Sort Characters By Frequency"]},
    {name:"Top K Frequent",idea:"\"Top K frequent\" or \"sort by frequency\".",when:"Top K Frequent Elements, Sort Characters By Frequency.",examples:["Top K Frequent Elements","Sort Characters By Frequency"]},
    {name:"Merge K Sorted",idea:"Heap holds one element from each list.",when:"Merge k Sorted Lists, Smallest Range From K Lists.",examples:["Merge k Sorted Lists","Smallest Range From K Lists"]},
    {name:"Heap Design / Streams",idea:"Use heap to always pick best candidate.",when:"Task Scheduler, Find Median From Data Stream.",examples:["Task Scheduler","Find Median From Data Stream"]},
    {name:"Heaps in Graphs",idea:"Priority queue for weighted shortest paths.",when:"Network Delay Time, Cheapest Flights Within K Stops.",examples:["Network Delay Time","Cheapest Flights Within K Stops"]},
  ]},
];

let activeFilter = "All";
let searchTerm = "";

const filtersEl = document.getElementById("filters");
const contentEl = document.getElementById("content");
const countEl = document.getElementById("count");
const totalEl = document.getElementById("total");
const searchEl = document.getElementById("search");

const total = data.reduce((s, d) => s + d.patterns.length, 0);
totalEl.textContent = total;

["All", ...data.map(d => d.cat)].forEach(cat => {
  const b = document.createElement("button");
  b.className = "filter-btn" + (cat === "All" ? " active" : "");
  b.textContent = cat;
  b.onclick = () => {
    activeFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
  filtersEl.appendChild(b);
});

searchEl.oninput = () => { searchTerm = searchEl.value.toLowerCase(); render(); };

function hl(text) {
  if (!searchTerm) return text;
  const re = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function render() {
  let shown = 0;
  let html = "";
  data.forEach(sec => {
    if (activeFilter !== "All" && activeFilter !== sec.cat) return;
    const filtered = sec.patterns.filter(p => {
      if (!searchTerm) return true;
      return p.name.toLowerCase().includes(searchTerm) ||
             p.idea.toLowerCase().includes(searchTerm) ||
             p.when.toLowerCase().includes(searchTerm) ||
             p.examples.some(e => e.toLowerCase().includes(searchTerm));
    });
    if (!filtered.length) return;
    shown += filtered.length;
    html += `<div class="category-section">
      <div class="cat-header">
        <div class="cat-dot" style="background:${sec.color}"></div>
        <span class="cat-title">${sec.cat}</span>
        <span class="cat-count">${filtered.length} pattern${filtered.length !== 1 ? "s" : ""}</span>
      </div>
      <div class="patterns-grid">`;
    filtered.forEach((p, i) => {
      const id = `card-${sec.cat.replace(/[\s/]/g, '-')}-${i}`;
      html += `<div class="pattern-card" id="${id}" onclick="toggle('${id}')">
        <div class="card-top">
          <span class="pattern-name">${hl(p.name)}</span>
          <span class="expand-icon">▼</span>
        </div>
        <div class="pattern-idea">${hl(p.idea)}</div>
        <div class="card-details">
          <div class="detail-row">
            <span class="detail-label">Spot it</span>
            <span class="detail-val">${hl(p.when)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Examples</span>
            <span class="detail-val">${p.examples.map(e => `<span class="example-pill">${hl(e)}</span>`).join("")}</span>
          </div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if (!shown) html = `<div class="no-results">No patterns match "${searchTerm}"</div>`;
  countEl.textContent = shown;
  contentEl.innerHTML = html;
}

function toggle(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("expanded");
}

render();
</script>
</body>
</html>
