<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Patterns & Interview Prep Dashboard</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Reset & CSS Custom Variables */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #0f1626;
      --bg-card: rgba(22, 30, 49, 0.7);
      --bg-card-hover: rgba(29, 41, 68, 0.85);
      --border-color: rgba(255, 255, 255, 0.07);
      --border-glow: rgba(99, 102, 241, 0.3);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.15);
      
      --difficulty-easy: #10b981;
      --difficulty-medium: #f59e0b;
      --difficulty-hard: #ef4444;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Light Theme Styling Variables */
    body.light-theme {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 0.98);
      --border-color: rgba(15, 23, 42, 0.08);
      --border-glow: rgba(99, 102, 241, 0.25);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.12);
      
      --difficulty-easy: #059669;
      --difficulty-medium: #d97706;
      --difficulty-hard: #dc2626;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      width: 100%;
      flex-grow: 1;
    }

    /* Glassmorphism Navigation / Header */
    header {
      margin-bottom: 2.5rem;
      position: relative;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .title-area h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .title-area p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    /* Tabs Controller */
    .tabs-controller {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Theme Toggle Button Style */
    .theme-toggle-btn {
      padding: 0.6rem;
      width: 38px;
      height: 38px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      margin-left: 4px;
    }

    .theme-toggle-btn:hover {
      color: var(--text-primary);
      background: rgba(128, 128, 128, 0.1);
    }

    /* Widgets / Stats Panel */
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--accent);
      border: 1px solid var(--border-color);
    }

    .stat-info {
      flex-grow: 1;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Live Progress Slider */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, #a855f7 100%);
      border-radius: 3px;
      transition: width 0.5s ease-out;
    }

    /* Search & Filters Panel */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    #search {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.75rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      transition: var(--transition);
    }

    body.light-theme #search {
      background: rgba(255, 255, 255, 0.6);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .filter-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      background: rgba(99, 102, 241, 0.1);
      color: var(--text-primary);
      border-color: var(--accent);
      box-shadow: inset 0 0 8px rgba(99, 102, 241, 0.1);
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Views Framework */
    .view-content {
      display: none;
    }

    .view-content.active {
      display: block;
    }

    /* Category Section Layout */
    .category-section {
      margin-bottom: 2.5rem;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-dot-large {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .cat-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cat-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: auto;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* Patterns Grid */
    .patterns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* Premium Pattern Card */
    .pattern-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .pattern-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      transition: var(--transition);
    }

    .pattern-card:hover {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2), 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .pattern-card.completed::before {
      background: linear-gradient(90deg, var(--difficulty-easy) 0%, #059669 100%);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .pattern-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pattern-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 0.65rem;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .pattern-checkbox:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    .pattern-checkbox.checked {
      background: var(--difficulty-easy);
      border-color: var(--difficulty-easy);
      color: #fff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .pattern-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .pattern-card.completed .pattern-name {
      color: var(--text-secondary);
      text-decoration: line-through rgba(255, 255, 255, 0.2);
    }

    .expand-icon {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
      user-select: none;
    }

    .pattern-card:hover .expand-icon {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .pattern-card.expanded .expand-icon {
      transform: rotate(180deg);
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .pattern-idea {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 0.75rem;
      flex-grow: 1;
    }

    /* Meta Badges */
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-easy {
      background: rgba(16, 185, 129, 0.08);
      color: var(--difficulty-easy);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .badge-medium {
      background: rgba(245, 158, 11, 0.08);
      color: var(--difficulty-medium);
      border: 1px solid rgba(245, 158, 11, 0.15);
    }

    .badge-hard {
      background: rgba(239, 68, 68, 0.08);
      color: var(--difficulty-hard);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .badge-complexity {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Card Expandable Details */
    .card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-top: 0px solid var(--border-color);
      margin-top: 0;
      padding-top: 0;
    }

    .pattern-card.expanded .card-details {
      max-height: 500px;
      border-top-width: 1px;
      margin-top: 1rem;
      padding-top: 1rem;
    }

    .detail-section {
      margin-bottom: 0.75rem;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .detail-body {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .example-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .example-pill {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none; /* Avoid default anchor underlines */
    }

    .example-pill i {
      font-size: 0.65rem;
      color: var(--accent);
      transition: var(--transition);
    }

    .example-pill:hover {
      background: rgba(99, 102, 241, 0.05);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .example-pill:hover i {
      transform: translate(1px, -1px); /* micro-animation for external link */
    }

    .pro-tip {
      background: rgba(99, 102, 241, 0.03);
      border: 1px dashed rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      margin-top: 0.75rem;
    }

    .pro-tip-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pro-tip-body {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* --- library styles --- */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      height: 100%;
      position: relative;
    }

    .book-card:hover {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2), 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .book-cover-mock {
      height: 160px;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book-cover-mock::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-right: 1px solid rgba(0,0,0,0.2);
      z-index: 3;
    }

    .book-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      border-radius: 8px;
    }

    .book-cover-fallback {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 1rem;
      text-align: center;
      z-index: 2;
      transition: opacity 0.4s ease;
    }

    .book-cover-icon {
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--border-glow);
      margin-bottom: 0.5rem;
    }

    .book-cover-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .book-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .book-author {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .book-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
    }

    .book-tag {
      font-size: 0.7rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    /* Floating Icon Actions styling */
    .book-actions {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      gap: 0.35rem;
      z-index: 10;
    }

    .book-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    .book-icon-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      transform: translateY(-1px);
    }

    body.light-theme .book-icon-btn {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(0, 0, 0, 0.08);
      color: #475569;
    }

    body.light-theme .book-icon-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Empty states */
    .no-results {
      text-align: center;
      padding: 4.5rem 1.5rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .no-results i {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }

    .no-results h3 {
      font-size: 1.1rem;
      font-weight: 500;

        cat: "Math & Geometry",
        color: "#eab308",
        patterns: [
          {
            name: "Mathematical Algorithms",
            difficulty: "Easy",
            complexity: "Time: O(log N) or O(1) | Space: O(1)",
            idea: "Leverage analytical theorems, prime factors, coordinate calculations, or numerical properties to solve challenges.",
            when: "String conversions, random sampling weight calculations, exponentiation, numerical reversals, or checking coordinates.",
            examples: ["Roman to Integer", "Random Pick with Weight", "Pow(x, n)", "Reverse Integer", "Palindrome Number", "First Missing Positive"],
            tip: "Watch out for numerical overflows when reversing digits or multiplying terms. Use 64-bit integer fallbacks."
          }
        ]
      },
      {
        cat: "Matrices",
        color: "#22c55e",
        patterns: [
          {
            name: "Grid-based Operations",
            difficulty: "Medium",
            complexity: "Time: O(M * N) | Space: O(1) or O(M * N)",
            idea: "Scan, rotate, or modify values inside a two-dimensional grid layout following structural rules.",
            when: "Clockwise rotations, spiral sweeps, coordinate shifts, or cell zipping.",
            examples: ["Spiral Matrix", "Valid Sudoku", "Rotate Image", "Set Matrix Zeroes", "Sudoku Solver"],
            tip: "Use markers or flag rows/columns (like setting state variables on row 0 and column 0) to compute in-place modifications."
          }
        ]
      }
    ];

    const booksData = [
      {
        title: "Coding Interview Patterns",
        author: "Alex Xu & Shaun Gunawardane",
        tagline: "Nail Your Next Coding Interview (ByteByteGo)",
        desc: "A highly visual guide that walks you through core algorithmic patterns using intuitive illustrations, dry runs, and practical coding exercises.",
        path: "books/Alex Xu & Shaun Gunawardane - Coding Interview Patterns.pdf",
        tags: ["DSA", "LeetCode", "ByteByteGo", "2024 Release"]
      },
      {
        title: "Coding Interview Patterns (Bonus)",
        author: "Alex Xu & Shaun Gunawardane",
        tagline: "Advanced Patterns & Heuristics (ByteByteGo)",
        desc: "A compilation of advanced problem-solving techniques and bonus patterns to tackle highly complex algorithmic puzzles in top-tier interviews.",
        path: "books/Alex Xu & Shaun Gunawardane - Coding Interview Patterns (Bonus).pdf",
        tags: ["Advanced", "DSA", "Interview Prep"]
      },
      {
        title: "AlgoTutor - LeetCode Patterns",
        author: "AlgoTutor",
        tagline: "Structured Learning Syllabus",
        desc: "A structured syllabus mapped directly to core patterns and high-frequency LeetCode questions, sorting problems systematically from Easy to Hard.",
        path: "books/AlgoTutor - LeetCode Patterns.pdf",
        tags: ["Syllabus", "Curated Problems", "Targeted Prep"]
      },
      {
        title: "System Design Interview (Volume 2)",
        author: "Alex Xu & Sahn Lam",
        tagline: "An Insider's Guide (Byte Code)",
        desc: "Deep-dives into real-world system design questions including distributed caches, search autocompletes, payment systems, and gaming backends.",
        path: "books/Alex Xu & Sahn Lam - System Design Interview (Volume 2).pdf",
        tags: ["System Design", "Architecture", "ByteByteGo"]
      },
      {
        title: "Designing Data-Intensive Applications",
        author: "Martin Kleppmann",
        tagline: "The Definitive Distributed Systems Guide",
        desc: "The bible for engineering data systems. Covers storage engines, transactions, partition keys, replication, consensus, and system trade-offs.",
        path: "books/Martin Kleppmann - Designing Data-Intensive Applications.pdf",
        tags: ["Systems", "Databases", "Distributed Systems"]
      },
      {
        title: "GAMAM Technical Interview Guide",
        author: "GAMAM Prep Consortium",
        tagline: "FAANG Interview Playbook",
        desc: "Comprehensive cheatsheets, behavioral guidelines, and dynamic problem roadmaps targeted specifically at top-tier FAANG/GAMAM interviews.",
        path: "books/GAMAM Technical Interview Guide.pdf",
        tags: ["Interview Cheat Sheet", "Behavioral", "FAANG Guide"]
      }
    ];

    // APPLICATION STATE
    let currentTab = "patterns";
    let activeCategory = "All";
    let searchTerm = "";
    let completedPatterns = {};
    let currentTheme = "dark";

    // PATH ENCODER FOR PDF RESOLUTION
    function encodeBookPath(path) {
      const parts = path.split('/');
      if (parts.length > 1) {
        return parts[0] + '/' + encodeURIComponent(parts[1]);
      }
      return encodeURIComponent(path);
    }

    // RESOLVE STATIC HD COVER IMAGE PATH
    function getBookCoverPath(path) {
      const parts = path.split('/');
      if (parts.length > 1) {
        const filename = parts[1].replace('.pdf', '.png');
        return 'books/covers/' + encodeURIComponent(filename);
      }
      return '';
    }

    // GENERATE LIVE LEETCODE PROBLEM URL DYNAMICALLY
    function getLeetCodeUrl(problemName) {
      // Overrides for problem names whose standard slug does not match LeetCode's actual URL slug
      const overrides = {
        "two sum ii": "two-sum-input-array-is-sorted"
      };

      const normalized = problemName.toLowerCase().trim();
      if (overrides[normalized]) {
        return `https://leetcode.com/problems/${overrides[normalized]}/`;
      }

      const slug = problemName
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '') // remove brackets, parentheses, ampersands, commas, etc.
        .trim()
        .replace(/[\s-]+/g, '-');   // replace spaces and consecutive hyphens with one hyphen
      return `https://leetcode.com/problems/${slug}/`;
    }

    // THEME CONTROLLER
    function initTheme() {
      const stored = localStorage.getItem("dsa_theme");
      if (stored) {
        currentTheme = stored;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        currentTheme = "light";
      }
      applyTheme();
    }

    // TOGGLE THEME FUNCTION
    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      localStorage.setItem("dsa_theme", currentTheme);
      applyTheme();
    }

    function applyTheme() {
      const toggleIcon = document.querySelector("#theme-toggle i");
      if (currentTheme === "light") {
        document.body.classList.add("light-theme");
        if (toggleIcon) {
          toggleIcon.className = "fa-solid fa-sun";
          toggleIcon.style.color = "#f59e0b";
        }
      } else {
        document.body.classList.remove("light-theme");
        if (toggleIcon) {
          toggleIcon.className = "fa-solid fa-moon";
          toggleIcon.style.color = "";
        }
      }
    }

    // LOCAL STORAGE SYNC
    function loadCompletedState() {
      const stored = localStorage.getItem("dsa_completed_patterns");
      if (stored) {
        try {
          completedPatterns = JSON.parse(stored);
        } catch(e) {
          completedPatterns = {};
        }
      }
    }

    // SAVE STATE COMPLETED IN LOCALSTORAGE
    function saveCompletedState() {
      localStorage.setItem("dsa_completed_patterns", JSON.stringify(completedPatterns));
      updateProgressStats();
    }

    // DOM ELEMENTS
    const categoryFiltersEl = document.getElementById("category-filters");
    const patternsListEl = document.getElementById("patterns-list");
    const libraryGridEl = document.getElementById("library-grid");
    const searchEl = document.getElementById("search");
    
    const overallProgressText = document.getElementById("overall-progress-text");
    const overallProgressBar = document.getElementById("overall-progress-bar");
    const completedCountEl = document.getElementById("completed-count");
    
    // TAB SWITCHER
    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      
      const targetBtn = Array.from(document.querySelectorAll(".tab-btn")).find(btn => btn.getAttribute("onclick").includes(tabId));
      if (targetBtn) targetBtn.classList.add("active");
      
      document.querySelectorAll(".view-content").forEach(el => el.classList.remove("active"));
      document.getElementById(`${tabId}-view`).classList.add("active");
      
      // Update filters block visibility
      const filtersRow = document.getElementById("filters-row");
      if (tabId === "library") {
        filtersRow.style.display = "none";
      } else {
        filtersRow.style.display = "flex";
      }
      
      render();
    }

    // INITIALIZE FILTERS
    function initFilters() {
      categoryFiltersEl.innerHTML = "";
      
      // Add 'All' Filter
      const allBtn = document.createElement("button");
      allBtn.className = "filter-btn active";
      allBtn.innerHTML = `All`;
      allBtn.onclick = () => selectCategory("All", allBtn);
      categoryFiltersEl.appendChild(allBtn);
      
      // Add Specific Category Filters
      patternsData.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "filter-btn";
        btn.innerHTML = `<span class="filter-dot" style="background:${cat.color}"></span> ${cat.cat}`;
        btn.onclick = () => selectCategory(cat.cat, btn);
        categoryFiltersEl.appendChild(btn);
      });
    }

    function selectCategory(category, btnEl) {
      activeCategory = category;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      btnEl.classList.add("active");
      render();
    }

    // MATH STATS CALCULATION
    function updateProgressStats() {
      let total = 0;
      let completed = 0;
      
      patternsData.forEach(cat => {
        cat.patterns.forEach(p => {
          total++;
          if (completedPatterns[p.name]) {
            completed++;
          }
        });
      });
      
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      
      overallProgressText.textContent = `${percent}%`;
      overallProgressBar.style.width = `${percent}%`;
      completedCountEl.textContent = `${completed} / ${total}`;
    }

    // TEXT HIGHLIGHTER
    function highlightText(text) {
      if (!searchTerm) return text;
      const escapedQuery = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(${escapedQuery})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    // RENDER CONTROLLER
    function render() {
      searchTerm = searchEl.value.toLowerCase().trim();
      
      if (currentTab === "patterns") {
        renderPatterns();
      } else {
        renderLibrary();
      }
    }

    // RENDERING PATTERNS VIEW WITH LEETCODE REDIRECTION
    function renderPatterns() {
      let html = "";
      let totalShown = 0;
      
      patternsData.forEach(cat => {
        // Apply category filter
        if (activeCategory !== "All" && activeCategory !== cat.cat) return;
        
        // Apply search filter on patterns
        const filtered = cat.patterns.filter(p => {
          if (!searchTerm) return true;
          return p.name.toLowerCase().includes(searchTerm) ||
                 p.idea.toLowerCase().includes(searchTerm) ||
                 p.when.toLowerCase().includes(searchTerm) ||
                 p.examples.some(e => e.toLowerCase().includes(searchTerm)) ||
                 (p.tip && p.tip.toLowerCase().includes(searchTerm));
        });
        
        if (filtered.length === 0) return;
        totalShown += filtered.length;
        
        html += `
          <div class="category-section">
            <div class="cat-header">
              <div class="cat-dot-large" style="color: ${cat.color}; background-color: ${cat.color}"></div>
              <span class="cat-title">${cat.cat}</span>
              <span class="cat-count">${filtered.length} pattern${filtered.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="patterns-grid">
        `;
        
        filtered.forEach((p, idx) => {
          const isCompleted = !!completedPatterns[p.name];
          const badgeClass = p.difficulty === "Easy" ? "badge-easy" : p.difficulty === "Medium" ? "badge-medium" : "badge-hard";
          const cardId = `p-${cat.cat.replace(/[\s&]/g, '-')}-${idx}`;
          
          html += `
            <div class="pattern-card ${isCompleted ? 'completed' : ''}" id="${cardId}" onclick="handleCardClick(event, '${cardId}')">
              
              <div class="card-top">
                <div class="pattern-meta">
                  <div class="pattern-checkbox ${isCompleted ? 'checked' : ''}" onclick="togglePatternCompleted(event, '${p.name}')">
                    <i class="fa-solid fa-check"></i>
                  </div>
                  <span class="pattern-name">${highlightText(p.name)}</span>
                </div>
                <div class="expand-icon"><i class="fa-solid fa-chevron-down"></i></div>
              </div>
              
              <div class="pattern-idea">${highlightText(p.idea)}</div>
              
              <div class="badges-row">
                <span class="badge ${badgeClass}">${p.difficulty}</span>
                <span class="badge badge-complexity">${p.complexity}</span>
              </div>
              
              <!-- Hidden details inside accordion -->
              <div class="card-details">
                <div class="detail-section">
                  <div class="detail-title"><i class="fa-solid fa-bullseye"></i> Spot it (Heuristics)</div>
                  <div class="detail-body">${highlightText(p.when)}</div>
                </div>
                
                <div class="detail-section">
                  <div class="detail-title"><i class="fa-solid fa-code"></i> Canonical Examples (Click to Solve)</div>
                  <div class="example-pills">
                    ${p.examples.map(ex => `
                      <a href="${getLeetCodeUrl(ex)}" target="_blank" class="example-pill" title="Solve '${ex}' on LeetCode" onclick="event.stopPropagation();">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> ${highlightText(ex)}
                      </a>
                    `).join('')}
                  </div>
                </div>
                
                ${p.tip ? `
                  <div class="pro-tip">
                    <div class="pro-tip-title"><i class="fa-solid fa-lightbulb"></i> Pro-Tip</div>
                    <div class="pro-tip-body">${highlightText(p.tip)}</div>
                  </div>
                ` : ''}
              </div>
              
            </div>
          `;
        });
        
        html += `</div></div>`;
      });
      
      if (totalShown === 0) {
        html = `
          <div class="no-results">
            <i class="fa-solid fa-face-frown"></i>
            <h3>No Patterns Match Your Search</h3>
            <p>Try refining your search keyword or selecting a different category filter.</p>
          </div>
        `;
      }
      
      patternsListEl.innerHTML = html;
    }

    // RENDERING LIBRARY VIEW WITH FLOATING CORNER ICONS AND PRE-RENDERED HD PNG COVERS
    function renderLibrary() {
      let html = "";
      
      // Filter books based on search
      const filtered = booksData.filter(b => {
        if (!searchTerm) return true;
        return b.title.toLowerCase().includes(searchTerm) ||
               b.author.toLowerCase().includes(searchTerm) ||
               b.tagline.toLowerCase().includes(searchTerm) ||
               b.desc.toLowerCase().includes(searchTerm) ||
               b.tags.some(t => t.toLowerCase().includes(searchTerm));
      });
      
      if (filtered.length === 0) {
        html = `
          <div class="no-results">
            <i class="fa-solid fa-book-open"></i>
            <h3>No Reference Books Found</h3>
            <p>Ensure your search queries match book titles, authors, or categories.</p>
          </div>
        `;
        libraryGridEl.innerHTML = html;
        return;
      }
      
      filtered.forEach((b, idx) => {
        const encodedPath = encodeBookPath(b.path);
        const coverPath = getBookCoverPath(b.path);
        const fallbackId = `fallback-${idx}`;
        
        html += `
          <div class="book-card">
            
            <!-- FLOATING TOP-RIGHT CORNER ICON CONTROLS -->
            <div class="book-actions">
              <a href="${encodedPath}" target="_blank" class="book-icon-btn" title="Open PDF in Browser">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
              <a href="${encodedPath}" download="${b.title}.pdf" class="book-icon-btn" title="Download PDF">
                <i class="fa-solid fa-download"></i>
              </a>
            </div>

            <!-- BOOK COVER ART (LIGHTWEIGHT PRE-RENDERED HD PNG IMAGE WITH DYNAMIC CSS FALLBACK) -->
            <div class="book-cover-mock">
              <img src="${coverPath}" class="book-cover-img" alt="${b.title} Cover" onerror="this.style.display='none'; document.getElementById('${fallbackId}').style.display='flex';" />
              <div class="book-cover-fallback" id="${fallbackId}">
                <div class="book-cover-icon"><i class="fa-solid fa-book-open-reader"></i></div>
                <div class="book-cover-title">${b.title}</div>
              </div>
            </div>
            
            <div class="book-info">
              <div class="book-title">${highlightText(b.title)}</div>
              <div class="book-author"><i class="fa-solid fa-pen-nib"></i> ${highlightText(b.author)}</div>
              <div class="book-desc">${highlightText(b.desc)}</div>
              <div class="book-tags">
                ${b.tags.map(t => `<span class="book-tag">${highlightText(t)}</span>`).join('')}
              </div>
            </div>

          </div>
        `;
      });
      
      libraryGridEl.innerHTML = html;
    }

    // INTERACTION HANDLERS
    function handleCardClick(event, cardId) {
      // Prevent accordion toggle when clicking on checkbox or inside a link/pill
      if (event.target.closest('.pattern-checkbox') || event.target.closest('.example-pill')) {
        return;
      }
      
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.toggle("expanded");
      }
    }

    // TOGGLE SELECTION TAPPING CHECKBOXES
    function togglePatternCompleted(event, name) {
      event.stopPropagation(); // prevent card expand toggle
      
      if (completedPatterns[name]) {
        delete completedPatterns[name];
      } else {
        completedPatterns[name] = true;
      }
      
      saveCompletedState();
      
      // Fast state refresh
      render();
    }

    // SEARCH INPUT LISTENER
    searchEl.addEventListener("input", render);

    // SYSTEM INIT
    window.addEventListener("DOMContentLoaded", () => {
      initTheme();
      loadCompletedState();
      initFilters();
      updateProgressStats();
      render();
    });
  </script>
</body>
</html>
